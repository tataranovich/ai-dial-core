name: Cleanup untagged images

on:
  workflow_dispatch:

jobs:
  clean:
    name: Delete untagged images
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          owner: ${{ github.repository_owner }}
          package: ${{ github.event.repository.name }}
          delete-untagged: true
